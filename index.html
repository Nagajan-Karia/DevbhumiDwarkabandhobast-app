<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #4a5568;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #3182ce;
        }
        button {
            padding: 12px;
            background-color: #0052cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #003e99;
        }
        #result {
            margin-top: 25px;
            text-align: left;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8fafc;
            border-left: 5px solid #0052cc;
            display: none;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 15px;
            color: #2d3748;
        }
        .result-item strong {
            color: #1a202c;
        }
        .error-message {
            color: #e53e3e;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👮‍♂️ બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ</h2>
    <p class="subtitle">Devbhumi Dwarka (NNK)</p>

    <div class="search-box">
        <h3>🔍 બંદોબસ્ત પોઈન્ટ શોધો</h3>
        <input type="text" id="mobileInput" placeholder="૧૦ આંકડાનો મોબાઈલ નંબર નાખો" maxlength="10">
        <button onclick="searchDuty()">શોધો</button>
    </div>

    <div id="result"></div>
</div>

<script>
async function searchDuty() {
    const mobile = document.getElementById('mobileInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (mobile.length !== 10 || isNaN(mobile)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p class="error-message">કૃપા કરીને સાચો ૧૦ આંકડાનો મોબાઈલ નંબર નાખો.</p>';
        return;
    }

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<p style="text-align:center;">શોધી રહ્યું છે...</p>';

    try {
        // Render સર્વરની લાઈવ API લિંક
        const response = await fetch(https://devbhumidwarkabandhobast-app.onrender.com/search?mobile=${mobile});
        const data = await response.json();

        if (response.ok && data.name) {
            resultDiv.innerHTML = `
                <div class="result-item"><strong>નામ:</strong> ${data.name}</div>
                <div class="result-item"><strong>હોદ્દો (Rank):</strong> ${data.rank || '-'}</div>
                <div class="result-item"><strong>પોઈન્ટ:</strong> ${data.point || '-'}</div>
                <div class="result-item"><strong>સમય (Time):</strong> ${data.time || '-'}</div>
            `;
        } else {
            resultDiv.innerHTML = <p class="error-message">${data.message || 'આ નંબર માટે કોઈ માહિતી મળી નથી.'}</p>;
        }
    } catch (error) {
        resultDiv.innerHTML = '<p class="error-message">સર્વર સાથે કનેક્ટ થઈ શક્યું નથી. થોડી વાર પછી પ્રયત્ન કરો.</p>';
    }
}
</script>

</body>
</html>
