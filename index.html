<!-- head ટેગની અંદર આ લિંક મૂકવી -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
  const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZUCXaVt5EJyWIGT4ABCsNwd_bkZfO8c5wWedJO9dV6EMdQ3xfXuMvdINP0zBx_fU5i-lkepLTzyWw/pub?output=csv";

  // આ ફંકશન ગૂગલ શીટમાંથી સીધો ડેટા લોડ કરશે
  function loadBandhobastData() {
      Papa.parse(sheetURL, {
          download: true,
          header: true,
          complete: function(results) {
              const data = results.data;
              console.log("લાઈવ ડેટા મળી ગયો:", data);
              // અહીં તમારો સર્ચ કરવાનો કોડ ચલાવો
          }
      });
  }

  // પેજ ઓપન થતાં જ ડેટા લોડ થઈ જશે
  window.onload = loadBandhobastData;
</script>
