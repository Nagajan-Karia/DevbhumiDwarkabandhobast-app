<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>બંદોબસ્ત પોઈન્ટ સિસ્ટમ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eef2f3; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .box { width: 380px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .excel-box { background: #f0fff4; border: 2px dashed #38a169; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        h2 { text-align: center; color: #2b6cb0; margin-top: 0; }
        input[type="text"], input[type="tel"], input[type="file"] { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 97%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-excel { background: #38a169; }
        .btn-excel:hover { background: #2f855a; }
        button:hover { background: #2c5282; }
        .card { margin-top: 15px; padding: 12px; background: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 4px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #1a365d;">👮‍♂️ બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ Devbhumi Dwarka (NNK) </h1>

    <div class="container">
        <!-- ૧. Excel અપલોડ અને મેન્યુઅલ એન્ટ્રી બોક્સ -->
        <div class="box">
            <!-- Excel Section -->
            <div class="excel-box">
                <h2 style="color: #2f855a;">📁 Excel ફાઈલ અપલોડ કરો</h2>
                <input type="file" id="excelFile" accept=".xlsx, .xls">
                <button onclick="uploadExcel()" class="btn-excel">📤 Excel અપલોડ કરો</button>
                <div id="excelResult" style="margin-top: 10px;"></div>
            </div>

            <!-- Single Entry Section -->
            <h2>➕ એક ડેટા ઉમેરો</h2>
            <input type="tel" id="addMobile" placeholder="૧૦ આંકડાનો મોબાઈલ નંબર" maxlength="10">
            <input type="text" id="addName" placeholder="અધિકારી/કર્મચારીનું નામ">
            <input type="text" id="addRank" placeholder="હોદ્દો (PC, PSI, PI)">
            <input type="text" id="addPoint" placeholder="પોઈન્ટનું નામ">
            <input type="text" id="addTime" placeholder="સમય (ઉ.દા. 08:00 AM થી 08:00 PM)">
            <button onclick="addDuty()">સેવ કરો</button>
            <div id="addResult" style="margin-top: 10px; text-align: center;"></div>
        </div>

        <!-- ૨. સર્ચ બોક્સ -->
        <div class="box">
            <h2>🔍 બંદોબસ્ત પોઈન્ટ શોધો</h2>
            <input type="tel" id="checkMobile" placeholder="૧૦ આંકડાનો મોબાઈલ નંબર નાખો" maxlength="10">
            <button onclick="checkDuty()">શોધો</button>
            <div id="checkResult"></div>
        </div>
    </div>

    <script>
        async function uploadExcel() {
            var fileInput = document.getElementById('excelFile');
            var excelResult = document.getElementById('excelResult');
            
            if (!fileInput.files[0]) { 
                alert("મહેરબાની કરીને Excel ફાઈલ પસંદ કરો!"); 
                return; 
            }

            excelResult.innerHTML = "<p style='color:blue;'>અપલોડ થઈ રહ્યું છે...</p>";

            var formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                var res = await fetch('http://127.0.0.1:5000/upload-excel', {
                    method: 'POST',
                    body: formData
                });
                var result = await res.json();
                excelResult.innerHTML = "<p style='color:green;'><b>" + result.message + "</b></p>";
            } catch (err) {
                excelResult.innerHTML = "<p style='color:red;'><b>અપલોડ કરવામાં ભૂલ આવી! સર્વર ચાલુ છે કે નહીં તે ચેક કરો.</b></p>";
            }
        }

        async function addDuty() {
            var data = {
                mobile: document.getElementById('addMobile').value,
                name: document.getElementById('addName').value,
                rank: document.getElementById('addRank').value,
                point: document.getElementById('addPoint').value,
                time_slot: document.getElementById('addTime').value
            };

            if (data.mobile.length !== 10 || !data.name || !data.point) {
                alert("કૃપા કરીને બધી વિગતો સાચી ભરો!");
                return;
            }

            try {
                var res = await fetch('http://127.0.0.1:5000/add-duty', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                var result = await res.json();
                document.getElementById('addResult').innerHTML = "<p style='color:green;'><b>" + result.message + "</b></p>";
            } catch (err) {
                alert("સર્વર કનેક્ટ થતું નથી!");
            }
        }

        async function checkDuty() {
            var mobile = document.getElementById('checkMobile').value;
            var checkResult = document.getElementById('checkResult');
            
            if (mobile.length !== 10) { alert("સાચો ૧૦ આંકડાનો નંબર નાખો"); return; }

            try {
                var res = await fetch('http://127.0.0.1:5000/get-duty/' + mobile);
                var data = await res.json();

                if (data.found) {
                    checkResult.innerHTML = '<div class="card">' +
                        '<p style="margin: 5px 0;"><b>નામ:</b> ' + data.name + ' (' + data.rank + ')</p>' +
                        '<p style="margin: 5px 0;"><b>પોઈન્ટ:</b> <span style="color:#2b6cb0; font-size:18px;"><b>' + data.point + '</b></span></p>' +
                        '<p style="margin: 5px 0;"><b>સમય:</b> ' + data.time_slot + '</p>' +
                    '</div>';
                } else {
                    checkResult.innerHTML = '<p style="color:red; margin-top:15px;">' + data.message + '</p>';
                }
            } catch (err) {
                alert("સર્વર સાથે કનેક્શન મળ્યું નથી!");
            }
        }
    </script>
</body>
</html>
