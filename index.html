<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background-color: #1e1e1e; border-radius: 12px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { font-size: 20px; margin-bottom: 5px; color: #e0e0e0; }
        p.subtitle { font-size: 14px; color: #a0a0a0; margin-top: 0; margin-bottom: 25px; }
        .search-box { margin-bottom: 20px; }
        label { display: block; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 16px; box-sizing: border-box; outline: none; text-align: center; }
        input:focus { border-color: #0d6efd; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #0056b3; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.2s; }
        button:hover { background-color: #004085; }
        #status { margin-top: 15px; color: #ffc107; font-size: 14px; font-weight: bold; }
        #results { margin-top: 20px; text-align: left; max-height: 350px; overflow-y: auto; }
        .result-item { background: #2c2c2c; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #0d6efd; font-size: 14px; }
        .result-item p { margin: 4px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>👮‍♂️ બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ</h2>
    <p class="subtitle">Devbhumi Dwarka (NNK)</p>

    <div class="search-box">
        <label>🔍 બંદોબસ્ત પોઈન્ટ શોધો</label>
        <input type="text" id="searchInput" placeholder="મોબાઈલ નંબર અથવા નામ લખો...">
        <button onclick="searchData()">શોધો</button>
    </div>

    <div id="status">ડેટા કનેક્ટ થઈ રહ્યો છે...</div>
    <div id="results"></div>
</div>

<script>
    // ગૂગલ શીટ CSV લિંક + પ્રોક્સી બાયપાસ
    const rawSheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZUCXaVt5EJyWIGT4ABCsNwd_bkZfO8c5wWedJO9dV6EMdQ3xfXuMvdINP0zBx_fU5i-lkepLTzyWw/pub?output=csv";
    const sheetURL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(rawSheetURL);

    let bandhobastData = [];

    function loadSheetData() {
        const statusDiv = document.getElementById('status');
        
        Papa.parse(sheetURL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if(results.data && results.data.length > 0) {
                    bandhobastData = results.data;
                    statusDiv.style.color = '#28a745';
                    statusDiv.innerText = "✅ ડેટા રેડી છે! હવે સર્ચ કરો.";
                } else {
                    statusDiv.style.color = '#dc3545';
                    statusDiv.innerText = "❌ શીટમાં કોઈ ડેટા મળ્યો નથી!";
                }
            },
            error: function(err) {
                console.error(err);
                statusDiv.style.color = '#dc3545';
                statusDiv.innerText = "❌ ડેટા કનેક્ટ થવામાં સમસ્યા છે!";
            }
        });
    }

    function searchData() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (!query) {
            resultsDiv.innerHTML = '<p style="color:#ff6b6b; text-align:center;">કૃપા કરીને નંબર કે નામ લખો!</p>';
            return;
        }

        const filtered = bandhobastData.filter(row => {
            return Object.values(row).some(val => String(val).toLowerCase().includes(query));
        });

        if (filtered.length === 0) {
            resultsDiv.innerHTML = '<p style="color:#ff6b6b; text-align:center;">કોઈ રેકોર્ડ મળ્યો નથી!</p>';
            return;
        }

        filtered.forEach(item => {
            let itemHtml = '<div class="result-item">';
            for (const [key, value] of Object.entries(item)) {
                if(key && value) {
                    itemHtml += <p><strong>${key}:</strong> ${value}</p>;
                }
            }
            itemHtml += '</div>';
            resultsDiv.innerHTML += itemHtml;
        });
    }

    window.onload = loadSheetData;
</script>

</body>
</html>
