<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Devbhumi Dwarka બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { font-size: 20px; margin-bottom: 5px; color: #ffffff; }
    p.subtitle { color: #a0a0a0; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
    .search-box { margin-bottom: 15px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #2a2a2a; color: #fff; font-size: 16px; box-sizing: border-box; text-align: center; outline: none; }
    button { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:hover { background: #0b5ed7; }
    #statusMsg { margin-top: 15px; font-weight: bold; font-size: 14px; }
    .result-box { margin-top: 20px; text-align: left; background: #2a2a2a; padding: 15px; border-radius: 8px; border-left: 4px solid #0d6efd; display: none; }
    .result-item { margin-bottom: 8px; font-size: 15px; line-height: 1.4; }
    .result-item strong { color: #a0a0a0; }
  </style>
</head>
<body>

<div class="card">
  <h2>👮‍♂️ બંદોબસ્ત ડ્યુટી મેનેજમેન્ટ સિસ્ટમ</h2>
  <p class="subtitle">Devbhumi Dwarka (NNK)</p>

  <div class="search-box">
    <label style="display:block; margin-bottom: 8px; font-weight: bold;">🔍 બંદોબસ્ત પોઈન્ટ શોધો</label>
    <input type="text" id="searchInput" placeholder="મોબાઈલ નંબર અથવા નામ લખો...">
    <button type="button" onclick="searchData()">શોધો</button>
  </div>

  <div id="statusMsg"></div>

  <div id="resultBox" class="result-box"></div>
</div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbxKHZD-rGKDik6KwX9LA0_8qOnotSfU7KOnk44U2rTUH5AYSvuTcODUc_WfVBlzAFbg/exec";
                
  function cleanText(text) {
    if (!text) return "";
    return String(text).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function searchData() {
    var rawInput = document.getElementById("searchInput").value;
    var inputClean = cleanText(rawInput);
    var statusMsg = document.getElementById("statusMsg");
    var resultBox = document.getElementById("resultBox");

    if (!inputClean) {
      alert("મહેરબાની કરીને નામ અથવા નંબર દાખલ કરો!");
      return;
    }

    statusMsg.style.color = "#0d6efd";
    statusMsg.innerHTML = "⏳ શોધી રહ્યું છે...";
    resultBox.style.display = "none";

    fetch(API_URL)
      .then(function(response) {
        return response.json();
      })
      .then(function(result) {
        if (result.status === "success" && result.data && result.data.length > 1) {
          var rows = result.data;
          var headers = rows[0];
          var found = false;

          resultBox.innerHTML = "";

          for (var i = 1; i < rows.length; i++) {
            var row = rows[i];
            var rowClean = row.map(function(cell) { return cleanText(cell); }).join(" ");

            if (rowClean.indexOf(inputClean) !== -1) {
              found = true;
              var html = "<h4 style='margin-top:0; color:#0d6efd;'>✅ વિગત મળી:</h4>";
              
              headers.forEach(function(header, idx) {
                if (row[idx] !== undefined && row[idx] !== "") {
                  html += "<div class='result-item'><strong>" + header + ":</strong> " + row[idx] + "</div>";
                }
              });

              resultBox.innerHTML += html + "<hr style='border-color:#444; margin:15px 0;'>";
            }
          }

          if (found) {
            statusMsg.innerHTML = "";
            resultBox.style.display = "block";
          } else {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerHTML = "❌ આ નંબર અથવા નામનો કોઈ બંદોબસ્ત મળ્યો નથી!";
          }

        } else {
          statusMsg.style.color = "#ff4d4d";
          statusMsg.innerHTML = "❌ શીટમાં કોઈ ડેટા મળ્યો નથી!";
        }
      })
      .catch(function(error) {
        console.error(error);
        statusMsg.style.color = "#ff4d4d";
        statusMsg.innerHTML = "❌ કનેક્શન એરર! કૃપા કરીને Apps Script ની URL ચકાસો.";
      });
  }
</script>

</body>
</html>
